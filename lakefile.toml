name = "LeanFormal"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanFormal"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "LeanFormal"

[[lean_lib]]
name = "Iut"

[[lean_lib]]
name = "PadicField"
srcDir = "tmp/local-cft-port"

[[lean_lib]]
name = "Reciprocity"
srcDir = "tmp/local-cft-port"

[[lean_lib]]
name = "ClassFieldAxiom"
srcDir = "tmp/local-cft-port"

[[lean_lib]]
name = "Galois"
srcDir = "tmp/local-cft-port"

[[lean_lib]]
name = "Herbrand"
srcDir = "tmp/local-cft-port"

[[lean_lib]]
name = "Brauer"
srcDir = "tmp/local-cft-port"

[[lean_lib]]
name = "ContinuousKummerTheory"
srcDir = "tmp/local-cft-port/continuous-kummer-theory-main"
